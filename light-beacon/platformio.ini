; PlatformIO project for the Heltec Wireless Tracker V2 (ESP32-S3FN8)
; used as a standalone WS2812 LED test rig for the light beacon project.
;
; PlatformIO has no built-in board definition for the Heltec Wireless
; Tracker, so this targets the generic ESP32-S3 dev board and overrides
; the flash/USB settings to match the Tracker's ESP32-S3FN8 module
; (8MB flash, no PSRAM, native USB). V1.2 uses the same module, so these
; settings are unchanged from that board - only the reserved-pin list in
; config.h differs between the two revisions.

[env:heltec_wireless_tracker]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

monitor_speed = 115200
upload_speed = 921600

; ESP32-S3FN8 uses the native USB peripheral for the USB-serial console.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
    bblanchon/ArduinoJson@^7.1.0
